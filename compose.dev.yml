services:
  mongodb:
    hostname: mongodb.nyrkio.local
    container_name: mongodb
    image: mongodb/mongodb-community-server:8.0.19-ubi9
    environment:
      - API_PORT=27017
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    ports:
      - "27017:27017"
    command: mongod --quiet --logpath /dev/null

  backend:
    build: backend
    env_file:
      - .env.backend
    environment:
      - API_PORT=8000
      - GIT_SHA=${IMAGE_TAG}
      - SMTP_HOST=mailhog.nyrkio.local
      - SMTP_PORT=1025
    ports:
      - "8000:8000"
    hostname: api.nyrkio.local
    depends_on:
      - mongodb
      - mailhog
    develop:
      watch:
        - action: rebuild
          path: backend
          ignore:
            - backend/.ruff_cache
            - backend/.pytest_cache

  webhooks:
    build: backend
    env_file:
      - .env.backend
    environment:
      - API_PORT=8080
      - GIT_SHA=${IMAGE_TAG}
    ports:
      - "8080:8080"
    hostname: api.nyrkio.local
    depends_on:
      - mongodb
    develop:
      watch:
        - action: rebuild
          path: backend
          ignore:
            - backend/.ruff_cache
            - backend/.pytest_cache

  worker01:
    build: backend
    env_file:
      - .env.backend
    environment:
      - API_PORT=8081
      - GIT_SHA=${IMAGE_TAG}
    ports:
      - "8081:8081"
    hostname: api.nyrkio.local
    depends_on:
     - mongodb
    develop:
      watch:
        - action: rebuild
          path: backend
          ignore:
            - backend/.ruff_cache
            - backend/.pytest_cache

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    hostname: mailhog.nyrkio.local
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  nginx:
    build:
      context: ./
      dockerfile: ./nginx/Dockerfile.dev
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    develop:
      watch:
        - action: rebuild
          path: nginx
